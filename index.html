<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pamit — Trisha</title>
  <style>
    /* Halaman hampir kosong — hanya menampilkan pesan di tengah */
    :root{ --bg:#ffffff; --text:#111827; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .message{
      padding:32px 40px;
      border-radius:12px;
      box-shadow: 0 6px 24px rgba(17,24,39,0.06);
      font-size:18px;
      color:var(--text);
      text-align:center;
      max-width:780px;
      line-height:1.6;
      background:transparent; /* tetap terasa "kosong" */
    }
  </style>
</head>
<body>
  <div class="message">Terima kasih atas dukungannya selalu untuk Trisha! Kami ijin pamit.</div>
</body>
</html>
