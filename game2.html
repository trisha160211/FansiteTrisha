<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Game Tong Sampah — Shuffle Fix</title>
<style>
  body { font-family: Arial, sans-serif; background:#eee; text-align:center; padding:20px; }
  h1 { margin:8px 0 0 0; }
  .game-box {
    width: 600px;
    height: 360px;
    margin: 18px auto;
    border-radius:12px;
    border: 3px solid #333;
    background: url('bg.png') center/cover no-repeat;
    position: relative;
    overflow: hidden; /* PENTING: supaya tong tidak keluar box */
  }

  /* area tempat tong (relative) */
  .tong-area {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* tong sebagai div (spritesheet) */
  .tong {
    position: absolute;
    width: 120px;              /* TONG_W */
    height: 160px;             /* TONG_H */
    top: 50px;                 /* default top offset; akan disesuaikan JS */
    background-repeat: no-repeat;
    background-position: 0 0;
    cursor: pointer;
    user-select: none;
    will-change: transform, left; /* hint ke browser */
    /* gunakan transform untuk animasi (tidak layout) */
    transition: transform 320ms ease;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    border-radius: 8px;
  }

  /* saat sedang shuffle / disable klik */
  .shuffling .tong { pointer-events: none; }
  .disabled .tong { pointer-events: none; opacity: 0.9; }

  .controls {
    position: absolute;
    left: 218px;
    bottom: 12px;
  }
  button {
    padding: 8px 14px;
    font-size:14px;
    cursor:pointer;
  }
</style>
</head>
<body>
  <h1>Cari Trisha! 🎮</h1>
  <p>Pilih tong yang berisi Trisha!</p>

  <div class="game-box" id="gameBox">
    <div class="tong-area" id="tongArea">
      <!-- 3 tong (div supaya background-position bisa diubah untuk spritesheet) -->
      <div class="tong" data-slot="0"></div>
      <div class="tong" data-slot="1"></div>
      <div class="tong" data-slot="2"></div>
    </div>

    <div class="controls">
      <button id="btnRestart">Mulai Ulang / Shuffle</button>
    </div>
  </div>

<script>
/* -- CONFIG -- */
const TONG_W = 120;      // lebar tiap frame
const TONG_H = 160;      // tinggi tiap frame
const FRAME_COUNT = 4;   // jumlah frame spritesheet untuk tongkosong / tongtrisha
const GAP = 40;          // jarak antar tong (slot)
const SWAP_DURATION = 320; // ms, harus sinkron dengan CSS transition (transform)
const SHUFFLE_STEPS = 8;   // jumlah swap saat shuffle
const SPRITE_FPS = 10;     // fps animasi spritesheet saat reveal

/* -- ELEMENTS -- */
const gameBox = document.getElementById('gameBox');
const tongArea = document.getElementById('tongArea');
const tongEls = Array.from(document.querySelectorAll('.tong'));
const btnRestart = document.getElementById('btnRestart');

let positions = [];   // x positions untuk tiap slot
let slots = [];       // slots[i] = elemen yang sekarang berada di slot i
let animating = false;
let gameOver = false;

/* util */
const wait = ms => new Promise(res => setTimeout(res, ms));

/* hitung posisi slot berdasarkan lebar area */
function computePositions() {
  const areaW = tongArea.clientWidth;
  const totalWidth = TONG_W * 3 + GAP * 2;
  const startX = Math.max( (areaW - totalWidth) / 2, 8 ); // jaga margin
  positions = [
    startX,
    startX + (TONG_W + GAP) * 1,
    startX + (TONG_W + GAP) * 2
  ];
}

/* tempatkan elemen ke posisi slot (dipanggil di init dan resize) */
function layoutInitial() {
  computePositions();
  // initial mapping: slots 0..2 sesuai DOM order
  slots = tongEls.slice();
  for (let i=0;i<slots.length;i++) {
    const el = slots[i];
    el.style.left = positions[i] + 'px';
    el.style.top = Math.round((tongArea.clientHeight - TONG_H) / 2) + 'px';
    el.dataset.slot = i;
    el.style.transform = '';
    el.style.transition = ''; // clear temporary transition
    el.style.backgroundSize = `${TONG_W}px ${TONG_H}px`; // for cover single-frame cover image
    el.style.backgroundImage = `url('covertong.png')`;
    el.dataset.has = 'false';
  }
}

/* swap dua slot (a,b) dengan animasi transform.
   a,b = slot indices (0..2)
*/
function swapSlots(a,b, duration = SWAP_DURATION) {
  return new Promise(resolve => {
    if (a===b) { resolve(); return; }
    const elA = slots[a];
    const elB = slots[b];
    // hitung offset yg diperlukan
    const dxA = positions[b] - positions[a];
    const dxB = positions[a] - positions[b];

    // set transition (in case cleared)
    elA.style.transition = `transform ${duration}ms ease`;
    elB.style.transition = `transform ${duration}ms ease`;

    // trigger transform on next frame
    requestAnimationFrame(() => {
      elA.style.transform = `translateX(${dxA}px)`;
      elB.style.transform = `translateX(${dxB}px)`;
    });

    // setelah anim selesai, apply final left posisi & bersihkan transform
    setTimeout(() => {
      // clear transform and set absolute left to final pos
      elA.style.transition = ''; elB.style.transition = '';
      elA.style.transform = '';
      elB.style.transform = '';
      elA.style.left = positions[b] + 'px';
      elB.style.left = positions[a] + 'px';

      // update slots mapping (element berpindah slot)
      slots[a] = elB; elB.dataset.slot = a;
      slots[b] = elA; elA.dataset.slot = b;

      resolve();
    }, duration + 10);
  });
}

/* shuffle menggunakan swapSlots sekuensial untuk menghindari tumpukan */
async function shuffleAnimation() {
  if (animating) return;
  animating = true;
  gameBox.classList.add('shuffling');

  for (let i=0;i<SHUFFLE_STEPS;i++) {
    let a = Math.floor(Math.random()*3);
    let b;
    do { b = Math.floor(Math.random()*3); } while (b === a);
    await swapSlots(a,b);
    // sedikit delay antar swap supaya terasa alami
    await wait(80 + Math.floor(Math.random()*90));
  }

  gameBox.classList.remove('shuffling');
  animating = false;
}

/* main start (reset visuals, pilih elemen yg punya item, lalu shuffle) */
async function startGame() {
  if (animating) return;
  gameOver = false;

  // reset visuals
  for (const el of tongEls) {
    el.style.transition = '';
    el.style.transform = '';
    el.style.backgroundImage = `url('covertong.png')`;
    el.style.backgroundSize = `${TONG_W}px ${TONG_H}px`;
    el.dataset.has = 'false';
  }

  // random tetapkan 1 elemen (bukan slot) yang berisi item
  const randElementIndex = Math.floor(Math.random() * 3);
  // kalo kita ingin memilih berdasarkan elemen saat ini:
  slots[randElementIndex].dataset.has = 'true';

  // jalankan shuffle (selama shuffle klik diblok)
  await shuffleAnimation();
  // selesai shuffle -> pemain bisa klik
}

/* play spritesheet animation pada elemen (assume horizontal strip)
   el = element, spriteUrl = url, frameW/frameH = ukuran tiap frame, fps
   mengembalikan Promise yang resolve setelah semua frame selesai (menampilkan frame terakhir)
*/
function playSprite(el, spriteUrl, frameW, frameH, fps = SPRITE_FPS) {
  return new Promise(resolve => {
    const frameCount = FRAME_COUNT;
    let frame = 0;
    el.style.backgroundImage = `url('${spriteUrl}')`;
    // ukuran background: lebar = frameW * frameCount ; tinggi = frameH
    el.style.backgroundSize = `${frameW * frameCount}px ${frameH}px`;
    el.style.backgroundPosition = `0px 0px`;

    const interval = setInterval(() => {
      el.style.backgroundPosition = `-${frame * frameW}px 0px`;
      frame++;
      if (frame >= frameCount) {
        clearInterval(interval);
        // pastikan nampilin frame terakhir
        el.style.backgroundPosition = `-${(frameCount - 1) * frameW}px 0px`;
        resolve();
      }
    }, Math.round(1000 / fps));
  });
}

/* reveal setelah pemain klik slot tertentu */
async function revealChoice(slotIndex) {
  if (animating || gameOver) return;
  gameOver = true;
  animating = true;
  gameBox.classList.add('shuffling'); // blok interaksi

  const chosenEl = slots[slotIndex];
  const chosenHas = chosenEl.dataset.has === 'true';

  if (chosenHas) {
    // jalankan animasi isi pada elemen yang ditekan
    await playSprite(chosenEl, 'tongtrisha.png', TONG_W, TONG_H);
  } else {
    // jalankan animasi kosong di elemen yang ditekan
    await playSprite(chosenEl, 'tongkosong.png', TONG_W, TONG_H);
    // lalu tunjukkan mana yang benar
    const correctSlot = slots.findIndex(e => e.dataset.has === 'true');
    if (correctSlot >= 0) {
      await wait(120); // jeda estetika
      await playSprite(slots[correctSlot], 'tongtrisha.png', TONG_W, TONG_H);
    }
  }

  gameBox.classList.remove('shuffling');
  animating = false;
}

/* attach click listeners pada elemen (menggunakan data-slot yang selalu terupdate) */
tongEls.forEach(el => {
  el.addEventListener('click', (e) => {
    if (animating || gameBox.classList.contains('shuffling')) return;
    const slot = parseInt(el.dataset.slot, 10);
    revealChoice(slot);
  });
});

/* handle restart */
btnRestart.addEventListener('click', () => {
  startGame();
});

/* handle resize -> recalculate positions dan letakkan slot sesuai posisi baru */
window.addEventListener('resize', () => {
  computePositions();
  // set left sesuai slots mapping saat ini
  for (let i=0;i<slots.length;i++) {
    slots[i].style.left = positions[i] + 'px';
    slots[i].style.top = Math.round((tongArea.clientHeight - TONG_H) / 2) + 'px';
  }
});

/* init */
layoutInitial();
startGame();
</script>
</body>
</html>
